<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal | Depósito</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { 'villalba-blue': '#2563eb', 'background-dark': '#0a0f16', 'surface-dark': '#161e2a' } } }
        }
    </script>
    <link rel="stylesheet" href="../css/dark-theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { font-family: 'Public Sans', sans-serif; opacity: 0; animation: fadeInMenu 0.4s ease forwards; animation-delay: 0.1s; }
        @keyframes fadeInMenu { to { opacity: 1; } }
        .glass-card { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(0,0,0,0.1); backdrop-filter: blur(12px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        html.dark .glass-card { background: rgba(22, 30, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: none; }
        
        .menu-card { position: relative; overflow: hidden; }
        .menu-card::before {
            content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, transparent, rgba(255,255,255,0.1)); opacity: 0; transition: opacity 0.3s ease;
        }
        .menu-card:hover::before { opacity: 1; }
    </style>
</head>
<body class="bg-gradient-to-br from-[#6e8efb] to-[#a777e3] dark:from-[#0a0f16] dark:to-[#0a0f16] text-slate-900 dark:text-[#f1f5f9] antialiased min-h-screen flex flex-col relative transition-colors duration-300">
    
    <header class="bg-[#f8fafc]/90 dark:bg-background-dark/90 backdrop-blur-md shadow-sm dark:shadow-none border-b border-indigo-100 dark:border-slate-800 px-4 lg:px-6 py-3 flex items-center justify-between sticky top-0 z-40 w-full transition-colors relative">
        <div class="header-left flex items-center gap-3">
            <div class="h-9 w-9 rounded-xl bg-gradient-to-br from-indigo-500 to-villalba-blue flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
                <span class="material-symbols-outlined text-[18px]">widgets</span>
            </div>
            <h1 class="text-lg font-black tracking-tight uppercase text-slate-900 dark:text-white mt-0.5 hidden sm:block">Panel Principal</h1>
        </div>
        
        <div class="flex items-center gap-4">
            <span id="user-display-name" class="text-xs font-black text-slate-600 dark:text-slate-400 uppercase tracking-widest hidden md:inline-block">Cargando...</span>
        </div>
    </header>

    <main class="flex-1 w-full max-w-6xl mx-auto px-4 py-8 md:py-12 relative z-10 flex flex-col">
        <div class="glass-card rounded-[2.5rem] p-8 lg:p-14 shadow-2xl relative w-full border border-white/40 dark:border-slate-800/80">
            <div class="mb-10 text-left border-b border-slate-200 dark:border-slate-800 pb-6">
                <h2 id="role-title" class="text-3xl md:text-4xl font-black text-villalba-blue dark:text-blue-400 tracking-tight leading-none mb-2">Panel de Depósito</h2>
                <p id="user-role-display" class="text-xs md:text-sm font-black text-slate-500 uppercase tracking-[0.2em]">CONTROL DE INVENTARIO</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 lg:gap-16">
                <!-- Columna Izquierda -->
                <div>
                    <h3 class="text-[10px] font-black text-villalba-blue tracking-[0.2em] uppercase border-b border-slate-200 dark:border-slate-800 pb-2 mb-4">Gestión y Operatividad</h3>
                    <div class="flex flex-col gap-4" id="col-operatividad">
                        <!-- Cargado por JS -->
                    </div>
                </div>

                <!-- Columna Derecha -->
                <div>
                    <h3 class="text-[10px] font-black text-villalba-blue tracking-[0.2em] uppercase border-b border-slate-200 dark:border-slate-800 pb-2 mb-4">Administración Global</h3>
                    <div class="flex flex-col gap-4" id="col-administracion">
                        <!-- Cargado por JS -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="js/menu.js"></script>
    <script type="module" src="../js/global-sidebar.js"></script>
    <script type="module">import "../js/theme.js";</script>
</body>
</html>
