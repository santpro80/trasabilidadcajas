<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Ítems y Stock | Depósito</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { 'villalba-blue': '#2563eb', 'background-dark': '#0a0f16', 'surface-dark': '#161e2a' } } }
        }
    </script>
    <!-- Libreria Model Viewer para 3D -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link rel="stylesheet" href="../css/dark-theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { font-family: 'Public Sans', sans-serif; opacity: 0; animation: fadeInMenu 0.4s ease forwards; animation-delay: 0.1s; }
        @keyframes fadeInMenu { to { opacity: 1; } }
        .glass-card { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(0,0,0,0.1); backdrop-filter: blur(12px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        html.dark .glass-card { background: rgba(22, 30, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: none; }
        .grid-container { scrollbar-width: none; }
    </style>
</head>
<body class="bg-gradient-to-br from-[#6e8efb] to-[#a777e3] dark:from-[#0a0f16] dark:to-[#0a0f16] text-slate-900 dark:text-[#f1f5f9] antialiased min-h-screen flex flex-col relative overflow-x-hidden transition-colors duration-300">
    
    <header class="bg-[#f8fafc]/90 dark:bg-background-dark/90 backdrop-blur-md shadow-sm dark:shadow-none border-b border-indigo-100 dark:border-slate-800 px-4 lg:px-6 py-3 flex items-center justify-between sticky top-0 z-40 w-full transition-colors relative">
        <div class="header-left flex items-center gap-3">
            <button onclick="window.location.href='menu.html'" class="flex items-center justify-center size-9 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-400 transition-colors mr-1 group" title="Volver al Menú">
                <span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
            </button>
            <div class="h-9 w-9 rounded-xl bg-gradient-to-br from-indigo-500 to-villalba-blue flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
                <span class="material-symbols-outlined text-[18px]">category</span>
            </div>
            <h1 class="text-lg font-black tracking-tight uppercase text-slate-900 dark:text-white mt-0.5 hidden sm:block">Listado de Ítems y Stock</h1>
        </div>
        
        <div class="flex items-center gap-4">
            <span id="user-display-name" class="text-xs font-black text-slate-600 dark:text-slate-400 uppercase tracking-widest hidden md:inline-block">Cargando...</span>
        </div>
    </header>

    <main class="flex-1 w-full max-w-7xl mx-auto px-4 py-6 md:py-10 flex flex-col relative z-10 overflow-hidden">
        <!-- Choice Screen Container -->
        <div id="warehouse-choice-screen" class="flex-1 flex flex-col justify-center items-center py-12 w-full max-w-6xl mx-auto">
            <h2 class="text-2xl md:text-3xl font-black text-slate-800 dark:text-white uppercase tracking-tight mb-2 text-center">Listado de Ítems</h2>
            <p class="text-[10px] md:text-xs font-bold text-slate-500 uppercase tracking-[0.2em] mb-12 text-center">Seleccione el depósito que desea consultar</p>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 w-full px-4">
                <!-- No Estéril Terminado -->
                <button id="choice-no-esteril-terminado" class="flex flex-col items-center gap-6 p-8 bg-white dark:bg-surface-dark border border-slate-200 dark:border-slate-800 rounded-3xl group hover:shadow-2xl hover:border-blue-500 transition-all duration-300 transform hover:-translate-y-2 cursor-pointer w-full text-center">
                    <div class="size-16 rounded-2xl bg-blue-500/10 dark:bg-blue-500/20 text-blue-500 flex items-center justify-center group-hover:scale-110 transition-transform">
                        <span class="material-symbols-outlined text-[36px]">inventory</span>
                    </div>
                    <div>
                        <h3 class="text-sm font-black text-slate-900 dark:text-white uppercase tracking-widest mb-1 leading-tight">No Estéril Terminado</h3>
                        <p class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wide">Implantes y cajas no estériles terminados</p>
                    </div>
                </button>
                
                <!-- Estéril Terminado -->
                <button id="choice-esteril-terminado" class="flex flex-col items-center gap-6 p-8 bg-white dark:bg-surface-dark border border-slate-200 dark:border-slate-800 rounded-3xl group hover:shadow-2xl hover:border-emerald-500 transition-all duration-300 transform hover:-translate-y-2 cursor-pointer w-full text-center">
                    <div class="size-16 rounded-2xl bg-emerald-500/10 dark:bg-emerald-500/20 text-emerald-500 flex items-center justify-center group-hover:scale-110 transition-transform">
                        <span class="material-symbols-outlined text-[36px]">clean_hands</span>
                    </div>
                    <div>
                        <h3 class="text-sm font-black text-slate-900 dark:text-white uppercase tracking-widest mb-1 leading-tight">Estéril Terminado</h3>
                        <p class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wide">Cajas e implantes estériles terminados</p>
                    </div>
                </button>

                <!-- Semi Elaborado -->
                <button id="choice-semi-elaborado" class="flex flex-col items-center gap-6 p-8 bg-white dark:bg-surface-dark border border-slate-200 dark:border-slate-800 rounded-3xl group hover:shadow-2xl hover:border-purple-500 transition-all duration-300 transform hover:-translate-y-2 cursor-pointer w-full text-center">
                    <div class="size-16 rounded-2xl bg-purple-500/10 dark:bg-purple-500/20 text-purple-500 flex items-center justify-center group-hover:scale-110 transition-transform">
                        <span class="material-symbols-outlined text-[36px]">pending_actions</span>
                    </div>
                    <div>
                        <h3 class="text-sm font-black text-slate-900 dark:text-white uppercase tracking-widest mb-1 leading-tight">Semi Elaborado</h3>
                        <p class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wide">Productos en proceso de elaboración</p>
                    </div>
                </button>
                
                <!-- Materia Prima -->
                <button id="choice-materia-prima" class="flex flex-col items-center gap-6 p-8 bg-white dark:bg-surface-dark border border-slate-200 dark:border-slate-800 rounded-3xl group hover:shadow-2xl hover:border-amber-500 transition-all duration-300 transform hover:-translate-y-2 cursor-pointer w-full text-center">
                    <div class="size-16 rounded-2xl bg-amber-500/10 dark:bg-amber-500/20 text-amber-500 flex items-center justify-center group-hover:scale-110 transition-transform">
                        <span class="material-symbols-outlined text-[36px]">precision_manufacturing</span>
                    </div>
                    <div>
                        <h3 class="text-sm font-black text-slate-900 dark:text-white uppercase tracking-widest mb-1 leading-tight">Materia Prima</h3>
                        <p class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wide">Materiales y piezas de producción</p>
                    </div>
                </button>
            </div>
        </div>

        <!-- Main Catalog Container (Initially Hidden) -->
        <div id="catalog-main-container" class="glass-card rounded-[2rem] text-left w-full shadow-2xl relative flex flex-col flex-1 overflow-hidden min-h-[500px] hidden">
            
            <div class="px-8 pt-8 pb-4 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-100 dark:border-slate-800/50">
                <div class="flex items-center gap-3">
                    <button id="btn-back-to-choices" class="flex items-center justify-center size-9 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-400 transition-colors mr-1 group" title="Cambiar Depósito">
                        <span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
                    </button>
                    <h2 class="text-xl md:text-2xl font-black text-slate-800 dark:text-white uppercase tracking-tight flex items-center gap-2">
                        <span id="catalog-title-text">Listado de Ítems</span>
                        <span id="contador-items" class="text-xs font-bold bg-villalba-blue text-white px-3 py-1 rounded-full uppercase tracking-widest hidden animate-pulse">Cargando...</span>
                    </h2>
                </div>
                
                <div class="flex flex-col md:flex-row items-center gap-2 w-full md:w-auto">
                    <button id="btn-clear-list" class="hidden items-center justify-center px-3 py-2.5 bg-rose-50 dark:bg-rose-500/10 hover:bg-rose-500 text-rose-600 dark:text-rose-500 hover:text-white border border-rose-500/20 rounded-xl text-[10px] font-black uppercase tracking-widest transition-colors shadow-sm shrink-0 group" title="Vaciar lista personalizada">
                        <span class="material-symbols-outlined text-[18px]">delete</span>
                    </button>
                    <button id="btn-add-to-list" class="flex items-center justify-center px-3 py-2.5 bg-indigo-50 dark:bg-indigo-500/10 hover:bg-indigo-500 text-indigo-600 dark:text-indigo-400 hover:text-white border border-indigo-500/20 rounded-xl text-[10px] font-black uppercase tracking-widest transition-colors shadow-sm shrink-0 group" title="Añadir a la lista de descarga">
                        <span class="material-symbols-outlined text-[18px]">add</span>
                    </button>
                    <button id="btn-export-excel" class="flex items-center justify-center gap-2 px-4 py-2.5 bg-emerald-50 dark:bg-emerald-500/10 hover:bg-emerald-500 text-emerald-600 dark:text-emerald-500 hover:text-white border border-emerald-500/20 rounded-xl text-xs font-black uppercase tracking-widest transition-colors shadow-sm w-full md:w-auto shrink-0 group">
                        <span class="material-symbols-outlined text-[18px]">download</span>
                        <span id="export-btn-text">Descargar a Excel</span>
                    </button>
                    <div class="relative flex-1 w-full md:w-96 group ml-1">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[20px] group-focus-within:text-villalba-blue transition-colors">search</span>
                        <input type="text" id="buscador-catalogo" placeholder="Buscar por código o descripción..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 dark:bg-black/20 border-2 border-slate-200 dark:border-slate-800 rounded-xl text-sm font-bold text-slate-800 dark:text-white outline-none focus:border-villalba-blue transition-colors shadow-inner">
                    </div>
                </div>
            </div>

            <!-- Virtual Scroll Table -->
            <div id="scroll-container" class="flex-1 overflow-auto custom-scrollbar relative">
                <div id="virtual-stretcher" class="absolute top-0 left-0 w-full pointer-events-none" style="height: 0px;"></div>
                <table class="w-full border-collapse relative z-20">
                    <thead class="sticky top-0 z-30 bg-slate-100/90 dark:bg-surface-dark/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm">
                        <tr>
                            <th class="py-4 px-6 text-left text-[10px] font-black text-slate-500 uppercase tracking-widest w-24">Imagen</th>
                            <th class="py-4 px-6 text-left text-[10px] font-black text-slate-500 uppercase tracking-widest w-40">Código</th>
                            <th class="py-4 px-6 text-left text-[10px] font-black text-slate-500 uppercase tracking-widest">Descripción / Detalle</th>
                            <th class="py-4 px-6 text-center text-[10px] font-black text-slate-500 uppercase tracking-widest w-32">Stock Actual</th>
                        </tr>
                    </thead>
                    <tbody id="catalogo-tbody" class="divide-y divide-slate-100 dark:divide-slate-800/50">
                        <tr>
                            <td colspan="4" class="py-20 text-center">
                                <div class="flex flex-col items-center justify-center gap-4">
                                    <span class="material-symbols-outlined text-4xl animate-spin text-villalba-blue">sync</span>
                                    <span class="text-xs font-black uppercase tracking-widest text-slate-500">Cargando ítems...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
                
                <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-center">
                    <div class="size-20 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-300 dark:text-slate-600 mb-4">
                        <span class="material-symbols-outlined text-4xl">inventory_2</span>
                    </div>
                    <p class="text-sm font-black text-slate-400 uppercase tracking-widest">No se encontraron ítems en stock</p>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal para agrandar Imagen y Modelo 3D -->
    <div id="imageModal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[100] hidden items-center justify-center p-4 transition-opacity opacity-0 flex">
        <button id="closeImageModal" class="absolute top-4 right-4 md:top-8 md:right-8 p-3 text-white bg-white/10 hover:bg-rose-500 rounded-full transition-colors group z-20 shadow-lg cursor-pointer">
            <span class="material-symbols-outlined group-hover:scale-110 transition-transform">close</span>
        </button>

        <div id="modal-scroll-container" class="w-full h-full overflow-auto flex items-center justify-center p-4">
            <div id="modal-content-wrapper" class="relative flex flex-col items-center justify-center transition-transform duration-300 transform-origin-center">
                <img id="enlargedImage" src="" alt="Vista Previa" class="hidden max-w-[90vw] max-h-[85vh] object-contain rounded-xl shadow-2xl bg-white dark:bg-slate-800 p-2 border border-slate-700 transition-all duration-300">
            
                <model-viewer id="modal-3d" src="" 
                    alt="Modelo 3D del Implante" 
                    auto-rotate 
                    camera-controls 
                    shadow-intensity="1" 
                    exposure="1" 
                    environment-image="neutral" 
                    class="hidden w-[90vw] md:w-[600px] xl:w-[800px] h-[60vh] md:h-[600px] bg-slate-800/80 rounded-xl shadow-2xl border border-slate-700">
                    <div slot="poster" class="absolute inset-0 flex items-center justify-center bg-slate-800/80 rounded-xl">
                        <span class="text-white font-bold text-lg animate-pulse">Cargando Modelo 3D...</span>
                    </div>
                </model-viewer>
                
                <p id="modal-caption" class="text-white font-bold tracking-widest uppercase mt-4 text-sm bg-black/50 px-4 py-1.5 rounded-full z-20 text-center"></p>
            </div>
        </div>

        <!-- Controles de Zoom -->
        <div id="zoom-controls" class="fixed right-6 top-1/2 -translate-y-1/2 flex-col gap-3 z-[150] shadow-2xl bg-black/60 backdrop-blur-md p-2 rounded-2xl border border-white/10 opacity-0 transition-opacity duration-300 hidden md:flex pointer-events-none">
            <div class="pointer-events-auto flex flex-col gap-3">
                <button id="zoom-in" class="w-10 h-10 rounded-xl hover:bg-villalba-blue text-white flex items-center justify-center transition-colors cursor-pointer" title="Acercar (+)">
                    <span class="material-symbols-outlined text-[26px]">add</span>
                </button>
                <div class="w-full h-px bg-white/20"></div>
                <button id="zoom-reset" class="w-10 h-10 rounded-xl hover:bg-slate-600 text-white flex items-center justify-center transition-colors cursor-pointer" title="Restaurar Vista">
                    <span class="material-symbols-outlined text-[20px]">fit_screen</span>
                </button>
                <div class="w-full h-px bg-white/20"></div>
                <button id="zoom-out" class="w-10 h-10 rounded-xl hover:bg-villalba-blue text-white flex items-center justify-center transition-colors cursor-pointer" title="Alejar (-)">
                    <span class="material-symbols-outlined text-[26px]">remove</span>
                </button>
            </div>
        </div>
        
        <!-- Controles mobile -->
        <div id="zoom-controls-mobile" class="fixed bottom-10 left-1/2 -translate-x-1/2 gap-3 z-[150] shadow-2xl bg-black/60 backdrop-blur-md px-4 py-2 rounded-full border border-white/10 opacity-0 transition-opacity duration-300 md:hidden flex pointer-events-none">
            <div class="pointer-events-auto flex gap-3">
                <button id="zoom-out-mob" class="w-10 h-10 rounded-full hover:bg-villalba-blue text-white flex items-center justify-center transition-colors cursor-pointer">
                    <span class="material-symbols-outlined text-[26px]">remove</span>
                </button>
                <button id="zoom-reset-mob" class="w-10 h-10 rounded-full hover:bg-slate-600 text-white flex items-center justify-center transition-colors cursor-pointer">
                    <span class="material-symbols-outlined text-[20px]">fit_screen</span>
                </button>
                <button id="zoom-in-mob" class="w-10 h-10 rounded-full hover:bg-villalba-blue text-white flex items-center justify-center transition-colors cursor-pointer">
                    <span class="material-symbols-outlined text-[26px]">add</span>
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="js/catalogo.js?v=1.2"></script>
    <script type="module" src="../js/global-sidebar.js?v=1.2"></script>
    <script type="module">import "../js/theme.js";</script>
</body>
</html>
