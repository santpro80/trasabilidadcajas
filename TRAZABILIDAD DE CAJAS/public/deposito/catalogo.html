<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Ítems y Stock | Depósito</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { 'villalba-blue': '#2563eb', 'background-dark': '#0a0f16', 'surface-dark': '#161e2a' } } }
        }
    </script>
    <link rel="stylesheet" href="../css/dark-theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { font-family: 'Public Sans', sans-serif; opacity: 0; animation: fadeInMenu 0.4s ease forwards; animation-delay: 0.1s; }
        @keyframes fadeInMenu { to { opacity: 1; } }
        .glass-card { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(0,0,0,0.1); backdrop-filter: blur(12px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        html.dark .glass-card { background: rgba(22, 30, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: none; }
        .grid-container { scrollbar-width: none; }
    </style>
</head>
<body class="bg-gradient-to-br from-[#6e8efb] to-[#a777e3] dark:from-[#0a0f16] dark:to-[#0a0f16] text-slate-900 dark:text-[#f1f5f9] antialiased min-h-screen flex flex-col relative overflow-x-hidden transition-colors duration-300">
    
    <header class="bg-[#f8fafc]/90 dark:bg-background-dark/90 backdrop-blur-md shadow-sm dark:shadow-none border-b border-indigo-100 dark:border-slate-800 px-4 lg:px-6 py-3 flex items-center justify-between sticky top-0 z-40 w-full transition-colors relative">
        <div class="header-left flex items-center gap-3">
            <button onclick="window.location.href='menu.html'" class="flex items-center justify-center size-9 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-400 transition-colors mr-1 group" title="Volver al Menú">
                <span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
            </button>
            <div class="h-9 w-9 rounded-xl bg-gradient-to-br from-indigo-500 to-villalba-blue flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
                <span class="material-symbols-outlined text-[18px]">category</span>
            </div>
            <h1 class="text-lg font-black tracking-tight uppercase text-slate-900 dark:text-white mt-0.5 hidden sm:block">Listado de Ítems y Stock</h1>
        </div>
        
        <div class="flex items-center gap-4">
            <span id="user-display-name" class="text-xs font-black text-slate-600 dark:text-slate-400 uppercase tracking-widest hidden md:inline-block">Cargando...</span>
        </div>
    </header>

    <main class="flex-1 w-full max-w-7xl mx-auto px-4 py-6 md:py-10 flex flex-col relative z-10 overflow-hidden">
        <div class="glass-card rounded-[2rem] text-left w-full shadow-2xl relative flex flex-col flex-1 overflow-hidden min-h-[500px]">
            
            <div class="px-8 pt-8 pb-4 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-100 dark:border-slate-800/50">
                <h2 class="text-xl md:text-2xl font-black text-slate-800 dark:text-white uppercase tracking-tight flex items-center gap-2">
                    Listado de Ítems
                    <span id="contador-items" class="text-xs font-bold bg-villalba-blue text-white px-3 py-1 rounded-full uppercase tracking-widest hidden animate-pulse">Cargando...</span>
                </h2>
                
                <div class="flex flex-col md:flex-row items-center gap-2 w-full md:w-auto">
                    <button id="btn-clear-list" class="hidden items-center justify-center px-3 py-2.5 bg-rose-50 dark:bg-rose-500/10 hover:bg-rose-500 text-rose-600 dark:text-rose-500 hover:text-white border border-rose-500/20 rounded-xl text-[10px] font-black uppercase tracking-widest transition-colors shadow-sm shrink-0 group" title="Vaciar lista personalizada">
                        <span class="material-symbols-outlined text-[18px]">delete</span>
                    </button>
                    <button id="btn-add-to-list" class="flex items-center justify-center px-3 py-2.5 bg-indigo-50 dark:bg-indigo-500/10 hover:bg-indigo-500 text-indigo-600 dark:text-indigo-400 hover:text-white border border-indigo-500/20 rounded-xl text-[10px] font-black uppercase tracking-widest transition-colors shadow-sm shrink-0 group" title="Añadir a la lista de descarga">
                        <span class="material-symbols-outlined text-[18px]">add</span>
                    </button>
                    <button id="btn-export-excel" class="flex items-center justify-center gap-2 px-4 py-2.5 bg-emerald-50 dark:bg-emerald-500/10 hover:bg-emerald-500 text-emerald-600 dark:text-emerald-500 hover:text-white border border-emerald-500/20 rounded-xl text-xs font-black uppercase tracking-widest transition-colors shadow-sm w-full md:w-auto shrink-0 group">
                        <span class="material-symbols-outlined text-[18px]">download</span>
                        <span id="export-btn-text">Descargar a Excel</span>
                    </button>
                    <div class="relative flex-1 w-full md:w-96 group ml-1">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[20px] group-focus-within:text-villalba-blue transition-colors">search</span>
                        <input type="text" id="buscador-catalogo" placeholder="Buscar por código o descripción..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 dark:bg-black/20 border-2 border-slate-200 dark:border-slate-800 rounded-xl text-sm font-bold text-slate-800 dark:text-white outline-none focus:border-villalba-blue transition-colors shadow-inner">
                    </div>
                </div>
            </div>

            <!-- Virtual Scroll Table -->
            <div id="scroll-container" class="flex-1 overflow-auto custom-scrollbar relative">
                <div id="virtual-stretcher" class="absolute top-0 left-0 w-full pointer-events-none" style="height: 0px;"></div>
                <table class="w-full border-collapse relative z-20">
                    <thead class="sticky top-0 z-30 bg-slate-100/90 dark:bg-surface-dark/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm">
                        <tr>
                            <th class="py-4 px-6 text-left text-[10px] font-black text-slate-500 uppercase tracking-widest w-24">Imagen</th>
                            <th class="py-4 px-6 text-left text-[10px] font-black text-slate-500 uppercase tracking-widest w-40">Código</th>
                            <th class="py-4 px-6 text-left text-[10px] font-black text-slate-500 uppercase tracking-widest">Descripción / Detalle</th>
                            <th class="py-4 px-6 text-center text-[10px] font-black text-slate-500 uppercase tracking-widest w-32">Stock Actual</th>
                        </tr>
                    </thead>
                    <tbody id="catalogo-tbody" class="divide-y divide-slate-100 dark:divide-slate-800/50">
                        <tr>
                            <td colspan="4" class="py-20 text-center">
                                <div class="flex flex-col items-center justify-center gap-4">
                                    <span class="material-symbols-outlined text-4xl animate-spin text-villalba-blue">sync</span>
                                    <span class="text-xs font-black uppercase tracking-widest text-slate-500">Cargando ítems...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
                
                <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-center">
                    <div class="size-20 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-300 dark:text-slate-600 mb-4">
                        <span class="material-symbols-outlined text-4xl">inventory_2</span>
                    </div>
                    <p class="text-sm font-black text-slate-400 uppercase tracking-widest">No se encontraron ítems en stock</p>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal para agrandar Imagen -->
    <div id="imageModal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[100] hidden items-center justify-center p-4 transition-opacity opacity-0 flex">
        <div class="relative w-auto max-w-3xl flex flex-col items-center">
            <button id="closeImageModal" class="absolute -top-12 right-0 md:-right-12 w-10 h-10 bg-white/10 hover:bg-white/20 text-white rounded-full flex items-center justify-center transition-colors">
                <span class="material-symbols-outlined">close</span>
            </button>
            <img id="enlargedImage" src="" alt="Zoom" class="max-w-full max-h-[80vh] object-contain rounded-2xl shadow-2xl bg-white dark:bg-slate-800 p-2 border border-slate-200 dark:border-slate-700">
        </div>
    </div>

    <script type="module" src="js/catalogo.js"></script>
    <script type="module" src="../js/global-sidebar.js"></script>
    <script type="module">import "../js/theme.js";</script>
</body>
</html>
