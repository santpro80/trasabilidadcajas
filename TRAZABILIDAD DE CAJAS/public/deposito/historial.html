<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Movimientos | Depósito</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { 'villalba-blue': '#2563eb', 'background-dark': '#0a0f16', 'surface-dark': '#161e2a' } } }
        }
    </script>
    <link rel="stylesheet" href="../css/dark-theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { font-family: 'Public Sans', sans-serif; opacity: 0; animation: fadeInMenu 0.4s ease forwards; animation-delay: 0.1s; }
        @keyframes fadeInMenu { to { opacity: 1; } }
        .glass-card { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(0,0,0,0.1); backdrop-filter: blur(12px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        html.dark .glass-card { background: rgba(22, 30, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: none; }
        .table-container { scrollbar-width: thin; }
    </style>
</head>
<body class="bg-gradient-to-br from-[#6e8efb] to-[#a777e3] dark:from-[#0a0f16] dark:to-[#0a0f16] text-slate-900 dark:text-[#f1f5f9] antialiased min-h-screen flex flex-col relative overflow-x-hidden transition-colors duration-300">
    
    <!-- Navbar Premium -->
    <header class="bg-[#f8fafc]/90 dark:bg-background-dark/90 backdrop-blur-md shadow-sm dark:shadow-none border-b border-indigo-100 dark:border-slate-800 px-4 lg:px-6 py-3 flex items-center justify-between sticky top-0 z-40 w-full transition-colors relative">
        <div class="header-left flex items-center gap-3">
            <button onclick="window.location.href='menu.html'" class="flex items-center justify-center size-9 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-400 transition-colors mr-1 group" title="Volver al Menú">
                <span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
            </button>
            <div class="h-9 w-9 rounded-xl bg-gradient-to-br from-indigo-500 to-villalba-blue flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
                <span class="material-symbols-outlined text-[18px]">history</span>
            </div>
            <h1 class="text-lg font-black tracking-tight uppercase text-slate-900 dark:text-white mt-0.5 hidden sm:block">Historial de Movimientos</h1>
        </div>
        
        <div class="flex items-center gap-4">
            <span id="user-display-name" class="text-xs font-black text-slate-600 dark:text-slate-400 uppercase tracking-widest hidden md:inline-block">Cargando...</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-7xl mx-auto px-4 py-6 md:py-10 flex flex-col relative z-10 overflow-hidden">
        <!-- Choice Screen Container -->
        <div id="warehouse-choice-screen" class="flex-1 flex flex-col justify-center items-center py-12 w-full max-w-6xl mx-auto">
            <h2 class="text-2xl md:text-3xl font-black text-slate-800 dark:text-white uppercase tracking-tight mb-2 text-center">Historial de Movimientos</h2>
            <p class="text-[10px] md:text-xs font-bold text-slate-500 uppercase tracking-[0.2em] mb-12 text-center">Seleccione el depósito que desea consultar</p>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 w-full px-4">
                <!-- No Estéril Terminado -->
                <button id="choice-no-esteril-terminado" class="flex flex-col items-center gap-6 p-8 bg-white dark:bg-surface-dark border border-slate-200 dark:border-slate-800 rounded-3xl group hover:shadow-2xl hover:border-blue-500 transition-all duration-300 transform hover:-translate-y-2 cursor-pointer w-full text-center">
                    <div class="size-16 rounded-2xl bg-blue-500/10 dark:bg-blue-500/20 text-blue-500 flex items-center justify-center group-hover:scale-110 transition-transform">
                        <span class="material-symbols-outlined text-[36px]">inventory</span>
                    </div>
                    <div>
                        <h3 class="text-sm font-black text-slate-900 dark:text-white uppercase tracking-widest mb-1 leading-tight">No Estéril Terminado</h3>
                        <p class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wide">Implantes y cajas no estériles terminados</p>
                    </div>
                </button>
                
                <!-- Estéril Terminado -->
                <button id="choice-esteril-terminado" class="flex flex-col items-center gap-6 p-8 bg-white dark:bg-surface-dark border border-slate-200 dark:border-slate-800 rounded-3xl group hover:shadow-2xl hover:border-emerald-500 transition-all duration-300 transform hover:-translate-y-2 cursor-pointer w-full text-center">
                    <div class="size-16 rounded-2xl bg-emerald-500/10 dark:bg-emerald-500/20 text-emerald-500 flex items-center justify-center group-hover:scale-110 transition-transform">
                        <span class="material-symbols-outlined text-[36px]">clean_hands</span>
                    </div>
                    <div>
                        <h3 class="text-sm font-black text-slate-900 dark:text-white uppercase tracking-widest mb-1 leading-tight">Estéril Terminado</h3>
                        <p class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wide">Cajas e implantes estériles terminados</p>
                    </div>
                </button>

                <!-- Semi Elaborado -->
                <button id="choice-semi-elaborado" class="flex flex-col items-center gap-6 p-8 bg-white dark:bg-surface-dark border border-slate-200 dark:border-slate-800 rounded-3xl group hover:shadow-2xl hover:border-purple-500 transition-all duration-300 transform hover:-translate-y-2 cursor-pointer w-full text-center">
                    <div class="size-16 rounded-2xl bg-purple-500/10 dark:bg-purple-500/20 text-purple-500 flex items-center justify-center group-hover:scale-110 transition-transform">
                        <span class="material-symbols-outlined text-[36px]">pending_actions</span>
                    </div>
                    <div>
                        <h3 class="text-sm font-black text-slate-900 dark:text-white uppercase tracking-widest mb-1 leading-tight">Semi Elaborado</h3>
                        <p class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wide">Productos en proceso de elaboración</p>
                    </div>
                </button>
                
                <!-- Materia Prima -->
                <button id="choice-materia-prima" class="flex flex-col items-center gap-6 p-8 bg-white dark:bg-surface-dark border border-slate-200 dark:border-slate-800 rounded-3xl group hover:shadow-2xl hover:border-amber-500 transition-all duration-300 transform hover:-translate-y-2 cursor-pointer w-full text-center">
                    <div class="size-16 rounded-2xl bg-amber-500/10 dark:bg-amber-500/20 text-amber-500 flex items-center justify-center group-hover:scale-110 transition-transform">
                        <span class="material-symbols-outlined text-[36px]">precision_manufacturing</span>
                    </div>
                    <div>
                        <h3 class="text-sm font-black text-slate-900 dark:text-white uppercase tracking-widest mb-1 leading-tight">Materia Prima</h3>
                        <p class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wide">Materiales y piezas de producción</p>
                    </div>
                </button>
            </div>
        </div>

        <!-- Main History Container (Initially Hidden) -->
        <div id="historial-main-container" class="glass-card rounded-[2rem] p-6 lg:p-10 text-left w-full shadow-2xl relative flex flex-col h-full min-h-[500px] hidden">
            
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                <div class="flex items-center gap-3">
                    <button id="btn-back-to-choices" class="flex items-center justify-center size-9 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-400 transition-colors mr-1 group" title="Cambiar Depósito">
                        <span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
                    </button>
                    <h2 class="text-xl md:text-2xl font-black text-slate-800 dark:text-white uppercase tracking-tight flex items-center gap-2">
                        <span id="historial-title-text">Registro General</span>
                        <span id="contador-movimientos" class="text-xs font-bold bg-villalba-blue/10 text-villalba-blue px-3 py-1 rounded-full uppercase tracking-widest hidden">Cargando...</span>
                    </h2>
                </div>
                
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <!-- Buscador -->
                    <div class="relative flex-1 md:w-72">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">search</span>
                        <input type="text" id="buscador-historial" placeholder="Buscar por código o desc..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 dark:bg-black/20 border-2 border-slate-200 dark:border-slate-700/50 rounded-xl text-sm font-bold text-slate-800 dark:text-white outline-none focus:border-villalba-blue transition-colors">
                    </div>
                    
                    <!-- Filtro -->
                    <select id="filtro-tipo" class="bg-slate-50 dark:bg-black/20 border-2 border-slate-200 dark:border-slate-700/50 rounded-xl px-4 py-2.5 text-sm font-bold text-slate-800 dark:text-white outline-none focus:border-villalba-blue transition-colors cursor-pointer w-32 shrink-0">
                        <option value="Todos">Todos</option>
                        <option value="Ingreso">Ingreso</option>
                        <option value="Egreso">Egreso</option>
                        <option value="Ajuste">Ajuste</option>
                    </select>
                </div>
            </div>

            <!-- Tabla -->
            <div class="flex-1 overflow-auto table-container w-full rounded-xl border border-slate-200 dark:border-slate-700/50 relative">
                 <table class="w-full text-left border-collapse min-w-[800px]">
                    <thead class="sticky top-0 bg-slate-100 dark:bg-slate-800 z-10 shadow-sm">
                        <tr>
                            <th class="px-5 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-200 dark:border-slate-700/50 w-40">Fecha</th>
                            <th class="px-5 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-200 dark:border-slate-700/50 w-28">Tipo</th>
                            <th class="px-5 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-200 dark:border-slate-700/50 w-48">Código</th>
                            <th class="px-5 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-200 dark:border-slate-700/50">Descripción</th>
                            <th class="px-5 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-200 dark:border-slate-700/50 w-32 text-center">Cantidad</th>
                            <th class="px-5 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-200 dark:border-slate-700/50 w-48 text-right">Usuario</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body" class="divide-y divide-slate-100 dark:divide-slate-800/50 relative">
                        <!-- Loading State -->
                        <tr><td colspan="6" class="py-20 text-center"><span class="material-symbols-outlined text-4xl animate-spin text-villalba-blue">sync</span></td></tr>
                    </tbody>
                 </table>
            </div>

            <div class="mt-4 flex items-center justify-between text-xs font-bold text-slate-500 uppercase tracking-widest">
                <span id="mostrando-texto">Cargando registros...</span>
            </div>

        </div>
    </main>

    <script type="module" src="js/historial.js?v=1.2"></script>
    <script type="module" src="../js/global-sidebar.js?v=1.2"></script>
    <script type="module">import "../js/theme.js";</script>
</body>
</html>
