<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar por Préstamo | Trazabilidad</title>
    <link rel="stylesheet" href="../css/tailwind.css">
    <link rel="stylesheet" href="../css/dark-theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { font-family: 'Public Sans', sans-serif; opacity: 0; animation: fadeInMenu 0.4s ease forwards; animation-delay: 0.1s; }
        @keyframes fadeInMenu { to { opacity: 1; } }
        .glass-card { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(0,0,0,0.1); backdrop-filter: blur(12px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        html.dark .glass-card { background: rgba(22, 30, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: none; }
    </style>
</head>
<body class="bg-gradient-to-br from-[#6e8efb] to-[#a777e3] dark:from-[#0a0f16] dark:to-[#0a0f16] text-slate-900 dark:text-[#f1f5f9] antialiased min-h-screen flex flex-col relative overflow-x-hidden transition-colors duration-300">
    
    <header class="bg-[#f8fafc]/90 dark:bg-background-dark/90 backdrop-blur-md shadow-sm dark:shadow-none border-b border-indigo-100 dark:border-slate-800 px-4 lg:px-6 py-3 flex items-center justify-between sticky top-0 z-40 w-full transition-colors relative">
        <div class="header-left flex items-center gap-3">
            <button onclick="window.location.href='menu.html'" class="flex items-center justify-center size-9 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-400 transition-colors mr-1 group" title="Volver al Menú">
                <span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
            </button>
            <div class="h-9 w-9 rounded-xl bg-gradient-to-br from-indigo-500 to-villalba-blue flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
                <span class="material-symbols-outlined text-[18px]">manage_search</span>
            </div>
            <h1 class="text-lg font-black tracking-tight uppercase text-slate-900 dark:text-white mt-0.5 hidden sm:block">Búsqueda Avanzada</h1>
        </div>
        
        <div class="flex items-center gap-4">
            <span id="user-display-name" class="text-xs font-black text-slate-600 dark:text-slate-400 uppercase tracking-widest hidden md:inline-block">Cargando...</span>
        </div>
    </header>

    <main class="flex-1 w-full max-w-5xl mx-auto px-4 py-8 lg:py-12 flex flex-col relative z-10">
        
        <div class="glass-card rounded-[2rem] p-6 md:p-10 mb-8 border border-white/20 dark:border-slate-800/80 relative overflow-hidden shadow-2xl">
            <div class="mb-8 border-b border-slate-100 dark:border-slate-800/50 pb-6 text-center md:text-left">
                <h2 class="text-3xl lg:text-4xl font-black text-villalba-blue dark:text-white tracking-tight uppercase">Búsqueda Avanzada</h2>
                <p class="text-xs tracking-widest uppercase text-slate-500 font-bold mt-2">Localizar por Número de Préstamo</p>
            </div>
            
            <div class="flex flex-col md:flex-row items-center gap-6">
                <div class="w-16 h-16 shrink-0 rounded-2xl bg-villalba-blue text-white flex items-center justify-center shadow-lg shadow-villalba-blue/30">
                    <span class="material-symbols-outlined text-3xl">fact_check</span>
                </div>
                <div class="flex-1 w-full flex flex-col md:flex-row gap-4">
                    <div class="relative flex-1 group">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-villalba-blue transition-colors">search</span>
                        <input type="text" id="prestamo-search-input" placeholder="Ingresa el número de préstamo..." class="w-full pl-12 pr-6 py-4 rounded-2xl bg-slate-50 dark:bg-black/20 border-2 border-slate-200 dark:border-slate-800 focus:border-villalba-blue dark:focus:border-villalba-blue outline-none transition-all text-sm font-bold tracking-tight shadow-inner">
                    </div>
                    <button id="search-btn" class="w-full md:w-auto px-8 py-4 rounded-2xl bg-villalba-blue text-white font-black uppercase tracking-widest text-xs shadow-xl shadow-villalba-blue/30 hover:shadow-villalba-blue/40 hover:-translate-y-1 transition-all">Ejecutar Búsqueda</button>
                </div>
            </div>
        </div>

        <div id="loading-state" class="hidden flex-col items-center justify-center py-20 glass-card rounded-[2rem]">
            <span class="material-symbols-outlined text-5xl animate-spin text-villalba-blue mb-4">sync</span>
            <p class="text-xs font-black uppercase tracking-widest text-slate-500">Buscando Registro...</p>
        </div>

        <div id="empty-state" class="flex flex-col items-center justify-center py-20 glass-card rounded-[2rem] border border-dashed border-slate-300 dark:border-slate-700">
            <span class="material-symbols-outlined text-5xl mb-4 text-slate-300 dark:text-slate-600">manage_search</span>
            <p class="text-xs font-black uppercase tracking-widest text-slate-400 dark:text-slate-500">Ingresa un número para comenzar</p>
        </div>

        <div id="error-state" class="hidden flex-col items-center justify-center py-20 glass-card rounded-[2rem] border border-rose-200 dark:border-rose-500/20">
            <span class="material-symbols-outlined text-5xl mb-4 text-rose-500">error_outline</span>
            <p class="text-xs font-black uppercase tracking-widest text-rose-500" id="error-message">No se encontró el registro</p>
        </div>

        <div id="results-container" class="space-y-6"></div>
    </main>

    <script type="module" src="js/buscar-por-prestamo.js"></script>
    <script type="module" src="../js/global-sidebar.js"></script>
    <script type="module">import "../js/theme.js";</script>
</body>
</html>
