<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f16" />
    <title>Flujos | Diagram Sandbox</title>
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="../css/tailwind.css">
    <link rel="stylesheet" href="../css/dark-theme.css">

    <style>
        body {
            font-family: 'Public Sans', sans-serif;
            opacity: 0;
            animation: fadeIn 0.3s ease forwards;
            overflow: hidden;
            user-select: none;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Header adaptativo */
        .flujos-header {
            background-color: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid #e2e8f0;
        }

        html.dark .flujos-header {
            background-color: #0d131f !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #e2e8f0;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
        }

        html.dark .glass-panel {
            background: rgba(15, 23, 42, 0.9) !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6) !important;
        }

        /* Lienzo infinito con patrón de puntos */
        .canvas-bg-grid {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
            background-size: 24px 24px;
        }

        html.dark .canvas-bg-grid {
            background-color: #070b12 !important;
            background-image: radial-gradient(#1e293b 1.3px, transparent 1.3px) !important;
            background-size: 24px 24px;
        }

        /* ==========================================================================
           SISTEMA DE NODOS: MODO CLARO & MODO OSCURO DEFINIDO
           ========================================================================== */
        .flow-node {
            border-radius: 1.25rem;
            transition: box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s ease;
            will-change: left, top;
        }

        /* 1. Nodo Acción (Azul) */
        .flow-node-action {
            background-color: #ffffff;
            border: 2px solid #3b82f6;
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.18);
        }
        html.dark .flow-node-action {
            background-color: #0e1726 !important;
            border-color: #3b82f6 !important;
            box-shadow: 0 12px 30px -5px rgba(59, 130, 246, 0.3) !important;
        }
        html.dark .flow-node-action:hover {
            box-shadow: 0 16px 36px -4px rgba(59, 130, 246, 0.5) !important;
            border-color: #60a5fa !important;
        }

        /* 2. Nodo Decisión (Verde Esmeralda) */
        .flow-node-decision {
            background-color: #ffffff;
            border: 2px solid #10b981;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.18);
        }
        html.dark .flow-node-decision {
            background-color: #07221a !important;
            border-color: #10b981 !important;
            box-shadow: 0 12px 30px -5px rgba(16, 185, 129, 0.3) !important;
        }
        html.dark .flow-node-decision:hover {
            box-shadow: 0 16px 36px -4px rgba(16, 185, 129, 0.5) !important;
            border-color: #34d399 !important;
        }

        /* 3. Nodo Advertencia (Amarillo Cálido) */
        .flow-node-warning {
            background-color: #ffffff;
            border: 2px solid #f59e0b;
            box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.18);
        }
        html.dark .flow-node-warning {
            background-color: #271a09 !important;
            border-color: #f59e0b !important;
            box-shadow: 0 12px 30px -5px rgba(245, 158, 11, 0.3) !important;
        }
        html.dark .flow-node-warning:hover {
            box-shadow: 0 16px 36px -4px rgba(245, 158, 11, 0.5) !important;
            border-color: #fbbf24 !important;
        }

        /* 4. Nodo Nota / Comentario */
        .flow-node-note {
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
            box-shadow: 0 8px 20px -5px rgba(0, 0, 0, 0.06);
        }
        html.dark .flow-node-note {
            background-color: #111723 !important;
            border-color: #334155 !important;
            box-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.5) !important;
        }
        html.dark .flow-node-note:hover {
            border-color: #64748b !important;
        }

        /* Tipografía de Nodos */
        .flow-node .node-title {
            color: #0f172a;
        }
        html.dark .flow-node .node-title {
            color: #f8fafc !important;
        }

        .flow-node .node-text {
            color: #475569;
        }
        html.dark .flow-node .node-text {
            color: #94a3b8 !important;
        }

        /* Puertos */
        .flow-port {
            background-color: #ffffff;
        }
        html.dark .flow-port {
            background-color: #0f172a !important;
        }

        .flow-port:hover > div {
            transform: scale(1.6);
            transition: transform 0.15s;
        }

        /* Labels SVG en Aristas */
        .edge-label-bg {
            fill: #ffffff;
            stroke: #cbd5e1;
            stroke-width: 1.5;
        }
        html.dark .edge-label-bg {
            fill: #0f172a !important;
            stroke: #334155 !important;
            stroke-width: 1.5;
        }
        .edge-label-text {
            fill: #334155;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            pointer-events: none;
            font-family: inherit;
        }
        html.dark .edge-label-text {
            fill: #f1f5f9 !important;
        }
    </style>
</head>

<body class="bg-slate-50 dark:bg-[#0a0f16] text-slate-900 dark:text-[#f1f5f9] antialiased min-h-screen h-screen flex flex-col transition-colors duration-300">

    <!-- Top Navigation Bar -->
    <header class="h-16 flujos-header px-4 lg:px-6 flex items-center justify-between gap-3 shrink-0 z-30 shadow-sm relative">
        
        <!-- Left: Logo & Breadcrumbs -->
        <div class="flex items-center gap-3 overflow-hidden">
            <button onclick="window.history.back()" class="size-9 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors flex items-center justify-center shrink-0 cursor-pointer" title="Volver">
                <span class="material-symbols-outlined text-[20px]">arrow_back</span>
            </button>

            <div class="flex items-center gap-2.5 shrink-0">
                <div class="size-9 rounded-xl bg-gradient-to-br from-indigo-500 to-cyan-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
                    <span class="material-symbols-outlined text-[20px]">account_tree</span>
                </div>
                <div class="hidden sm:flex flex-col">
                    <span class="text-sm font-black tracking-tight uppercase leading-tight text-slate-900 dark:text-white">Flujos</span>
                    <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest leading-none">Diagram Sandbox</span>
                </div>
            </div>

            <!-- Separador Vertical -->
            <div class="h-6 w-px bg-slate-200 dark:bg-slate-800 shrink-0 hidden md:block"></div>

            <!-- Migas de Pan (Breadcrumbs multinivel) -->
            <nav id="breadcrumbs-container" class="flex items-center gap-2 overflow-x-auto py-1 hide-scrollbar">
                <!-- Generado dinámicamente por ui.js -->
            </nav>
        </div>

        <!-- Right: Actions & User -->
        <div class="flex items-center gap-2 shrink-0">
            <!-- Botones Rápidos de Agregar Nodo -->
            <div class="hidden lg:flex items-center gap-1.5 bg-slate-100 dark:bg-slate-900/60 p-1 rounded-2xl border border-slate-200 dark:border-slate-800">
                <button data-quick-add="action" class="px-2.5 py-1.5 rounded-xl bg-blue-500/10 hover:bg-blue-500/20 text-blue-600 dark:text-blue-400 text-[11px] font-black uppercase tracking-wider flex items-center gap-1 transition-all cursor-pointer" title="Agregar Paso de Acción (Azul)">
                    <span class="material-symbols-outlined text-[15px]">bolt</span> Acción
                </button>
                <button data-quick-add="decision" class="px-2.5 py-1.5 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 text-[11px] font-black uppercase tracking-wider flex items-center gap-1 transition-all cursor-pointer" title="Agregar Decisión / Bifurcación (Verde)">
                    <span class="material-symbols-outlined text-[15px]">call_split</span> Decisión
                </button>
                <button data-quick-add="warning" class="px-2.5 py-1.5 rounded-xl bg-amber-500/10 hover:bg-amber-500/20 text-amber-600 dark:text-amber-400 text-[11px] font-black uppercase tracking-wider flex items-center gap-1 transition-all cursor-pointer" title="Agregar Advertencia / Control (Amarillo)">
                    <span class="material-symbols-outlined text-[15px]">warning</span> Alerta
                </button>
                <button data-quick-add="note" class="px-2.5 py-1.5 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-[11px] font-black uppercase tracking-wider flex items-center gap-1 transition-all cursor-pointer" title="Agregar Nota explicativa (Gris)">
                    <span class="material-symbols-outlined text-[15px]">description</span> Nota
                </button>
            </div>

            <!-- Separador -->
            <div class="h-6 w-px bg-slate-200 dark:bg-slate-800 shrink-0 hidden sm:block"></div>

            <!-- Herramientas de Archivo -->
            <div class="flex items-center gap-1">
                <button id="btn-save" class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 transition-colors flex items-center justify-center cursor-pointer" title="Guardar cambios (Ctrl+S)">
                    <span class="material-symbols-outlined text-[19px]">save</span>
                </button>
                <button id="btn-export-json" class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 transition-colors flex items-center justify-center cursor-pointer" title="Exportar Diagrama a JSON">
                    <span class="material-symbols-outlined text-[19px]">download</span>
                </button>
                <button id="btn-import-json" class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 transition-colors flex items-center justify-center cursor-pointer" title="Importar Diagrama desde JSON">
                    <span class="material-symbols-outlined text-[19px]">upload</span>
                </button>
                <button id="btn-reset-diagram" class="p-2 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-500 transition-colors flex items-center justify-center cursor-pointer" title="Restablecer plantilla de ejemplo">
                    <span class="material-symbols-outlined text-[19px]">restart_alt</span>
                </button>
                <input type="file" id="import-file-input" accept=".json" class="hidden" />
            </div>

            <!-- Usuario -->
            <span id="user-display-name" class="text-xs font-black text-slate-500 uppercase tracking-widest hidden xl:inline-block ml-1">...</span>
        </div>
    </header>

    <!-- Main Canvas Viewport (Infinite Sandbox) -->
    <main class="flex-1 relative overflow-hidden canvas-bg-grid" id="canvas-container">
        
        <!-- SVG Layer para Conexiones / Cables Bezier -->
        <svg id="canvas-svg" class="absolute inset-0 w-full h-full pointer-events-none z-10 overflow-visible">
            <g id="canvas-transform-group">
                <g id="canvas-edges-group"></g>
            </g>
        </svg>

        <!-- HTML Layer para Nodos Interactivos -->
        <div id="canvas-nodes-layer" class="absolute inset-0 z-20 pointer-events-auto">
            <!-- Nodos renderizados dinámicamente -->
        </div>

        <!-- Floating HUD / Zoom Controls (Abajo a la derecha) -->
        <div class="absolute bottom-6 right-6 z-30 flex items-center gap-2 glass-panel p-2 rounded-2xl shadow-xl">
            <button id="btn-zoom-out" class="size-9 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center transition-colors cursor-pointer" title="Alejar (-)">
                <span class="material-symbols-outlined text-[20px]">remove</span>
            </button>
            <span id="zoom-percentage" class="text-xs font-black px-2 text-slate-700 dark:text-slate-300 select-none">100%</span>
            <button id="btn-zoom-in" class="size-9 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center transition-colors cursor-pointer" title="Acercar (+)">
                <span class="material-symbols-outlined text-[20px]">add</span>
            </button>
            <div class="h-5 w-px bg-slate-300 dark:bg-slate-700"></div>
            <button id="btn-zoom-reset" class="size-9 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center transition-colors cursor-pointer" title="Centrar todo el diagrama">
                <span class="material-symbols-outlined text-[19px]">fit_screen</span>
            </button>
        </div>

        <!-- Floating Instructions (Abajo a la izquierda) -->
        <div class="absolute bottom-6 left-6 z-30 hidden md:flex items-center gap-3 glass-panel px-4 py-2 rounded-2xl shadow-xl text-[10px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
            <span class="flex items-center gap-1"><span class="material-symbols-outlined text-[14px] text-blue-500">pan_tool</span> Arrastrar lienzo</span>
            <span>•</span>
            <span class="flex items-center gap-1"><span class="material-symbols-outlined text-[14px] text-emerald-500">mouse</span> Rueda: Zoom</span>
            <span>•</span>
            <span class="flex items-center gap-1"><span class="material-symbols-outlined text-[14px] text-amber-500">ads_click</span> Clic derecho: Opciones</span>
            <span>•</span>
            <span class="flex items-center gap-1"><span class="material-symbols-outlined text-[14px] text-indigo-500">double_arrow</span> Doble clic: Sub-diagrama</span>
        </div>
    </main>

    <!-- Menú Contextual del Lienzo (Clic Derecho en espacio vacío) -->
    <div id="context-menu-canvas" class="fixed z-50 hidden glass-panel rounded-2xl p-2 w-60 shadow-2xl border border-slate-200 dark:border-slate-800 flex flex-col gap-1 text-xs font-bold text-slate-800 dark:text-slate-200 animate-in fade-in zoom-in-95 duration-150">
        <div class="px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-400 border-b border-slate-200 dark:border-slate-800 mb-1">
            Crear Nuevo Nodo
        </div>
        <button data-action-create="action" class="flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-blue-500/10 hover:text-blue-500 transition-colors text-left cursor-pointer">
            <span class="material-symbols-outlined text-[18px] text-blue-500">bolt</span>
            <span>Paso de Acción (Azul)</span>
        </button>
        <button data-action-create="decision" class="flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-emerald-500/10 hover:text-emerald-500 transition-colors text-left cursor-pointer">
            <span class="material-symbols-outlined text-[18px] text-emerald-500">call_split</span>
            <span>Decisión / Condición (Verde)</span>
        </button>
        <button data-action-create="warning" class="flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-amber-500/10 hover:text-amber-500 transition-colors text-left cursor-pointer">
            <span class="material-symbols-outlined text-[18px] text-amber-500">warning</span>
            <span>Alerta / Control (Amarillo)</span>
        </button>
        <button data-action-create="note" class="flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors text-left cursor-pointer">
            <span class="material-symbols-outlined text-[18px] text-slate-400">description</span>
            <span>Comentario / Nota</span>
        </button>
        <div class="h-px bg-slate-200 dark:bg-slate-800 my-1"></div>
        <button id="ctx-action-fit" class="flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors text-left cursor-pointer">
            <span class="material-symbols-outlined text-[18px] text-slate-500">fit_screen</span>
            <span>Centrar diagrama</span>
        </button>
    </div>

    <!-- Menú Contextual del Nodo (Clic Derecho sobre un nodo) -->
    <div id="context-menu-node" class="fixed z-50 hidden glass-panel rounded-2xl p-2 w-64 shadow-2xl border border-slate-200 dark:border-slate-800 flex flex-col gap-1 text-xs font-bold text-slate-800 dark:text-slate-200 animate-in fade-in zoom-in-95 duration-150">
        <button id="ctx-node-subflow" class="flex items-center gap-3 px-3 py-2 rounded-xl bg-blue-500/10 hover:bg-blue-500/20 text-blue-600 dark:text-blue-400 transition-colors text-left cursor-pointer font-black">
            <span class="material-symbols-outlined text-[18px]">account_tree</span>
            <span>Abrir Sub-diagrama ↵</span>
        </button>
        <div class="h-px bg-slate-200 dark:bg-slate-800 my-1"></div>
        <div class="px-3 py-1 text-[9px] font-black uppercase tracking-widest text-slate-400">
            Conectar con nuevo nodo...
        </div>
        <button data-action-connect="action" class="flex items-center gap-3 px-3 py-1.5 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors text-left cursor-pointer">
            <span class="size-2 rounded-full bg-blue-500"></span>
            <span>Siguiente Acción</span>
        </button>
        <button data-action-connect="decision" class="flex items-center gap-3 px-3 py-1.5 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors text-left cursor-pointer">
            <span class="size-2 rounded-full bg-emerald-500"></span>
            <span>Decisión</span>
        </button>
        <button data-action-connect="warning" class="flex items-center gap-3 px-3 py-1.5 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors text-left cursor-pointer">
            <span class="size-2 rounded-full bg-amber-500"></span>
            <span>Alerta / Punto de Riesgo</span>
        </button>
        <div class="h-px bg-slate-200 dark:bg-slate-800 my-1"></div>
        <button id="ctx-node-comment" class="flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors text-left cursor-pointer">
            <span class="material-symbols-outlined text-[18px] text-slate-500">add_comment</span>
            <span>Agregar comentario vinculado</span>
        </button>
        <button id="ctx-node-edit" class="flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors text-left cursor-pointer">
            <span class="material-symbols-outlined text-[18px] text-slate-500">edit_note</span>
            <span>Editar texto y tipo</span>
        </button>
        <div class="h-px bg-slate-200 dark:bg-slate-800 my-1"></div>
        <button id="ctx-node-delete" class="flex items-center gap-3 px-3 py-2 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-600 dark:text-rose-400 transition-colors text-left cursor-pointer font-black">
            <span class="material-symbols-outlined text-[18px]">delete</span>
            <span>Eliminar nodo y conexiones</span>
        </button>
    </div>

    <!-- Modal para Editar Nodo -->
    <div id="edit-node-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="glass-panel rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-800 animate-in fade-in zoom-in-95 duration-200">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-200 dark:border-slate-800">
                <h3 class="text-base font-black uppercase tracking-wider text-slate-900 dark:text-white flex items-center gap-2">
                    <span class="material-symbols-outlined text-blue-500">edit_note</span>
                    Editar Nodo
                </h3>
                <button id="btn-close-edit-modal" class="size-8 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center text-slate-500 cursor-pointer">
                    <span class="material-symbols-outlined text-[20px]">close</span>
                </button>
            </div>

            <input type="hidden" id="edit-node-id" />

            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-1.5">Tipo de Nodo</label>
                    <select id="edit-node-type" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-800 rounded-xl text-xs font-bold text-slate-800 dark:text-white outline-none focus:border-blue-500 transition-colors">
                        <option value="action">Acción (Paso de proceso - Azul)</option>
                        <option value="decision">Decisión (Bifurcación - Verde)</option>
                        <option value="warning">Advertencia (Punto de riesgo - Amarillo)</option>
                        <option value="note">Comentario / Nota (Explicación)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-1.5">Título</label>
                    <input type="text" id="edit-node-title" placeholder="Ej: Control Dimensional..." class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-800 rounded-xl text-xs font-bold text-slate-800 dark:text-white outline-none focus:border-blue-500 transition-colors" />
                </div>

                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-1.5">Descripción / Contenido</label>
                    <textarea id="edit-node-text" rows="3" placeholder="Detalle o instrucción del paso..." class="w-full p-4 bg-slate-50 dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-800 rounded-xl text-xs font-bold text-slate-800 dark:text-white outline-none focus:border-blue-500 transition-colors"></textarea>
                </div>
            </div>

            <div class="mt-6 flex items-center justify-end gap-3 pt-4 border-t border-slate-200 dark:border-slate-800">
                <button type="button" onclick="document.getElementById('edit-node-modal').classList.add('hidden'); document.getElementById('edit-node-modal').classList.remove('flex');" class="px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer">
                    Cancelar
                </button>
